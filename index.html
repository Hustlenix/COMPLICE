<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120e0b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23120e0b'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23e0a878'/%3E%3Crect x='9' y='21' width='14' height='4' rx='2' fill='%23e0a878'/%3E%3C/svg%3E"
    />
    <title>COMPLICE — your world, your companion</title>
  </head>
  <body>
    <canvas
      id="scene"
      tabindex="-1"
      aria-label="COMPLICE virtual room. Use arrow keys to look around."
    ></canvas>

    <div id="hud">
      <header class="hud__top">
        <span class="wordmark">COMPLICE</span>
        <span id="status" class="pill" data-state="idle">Idle</span>
      </header>

      <div class="captioner" aria-live="polite">
        <p id="caption"></p>
      </div>

      <footer class="hud__bottom">
        <span class="hint">Keyboard and mouse for now · voice arrives in Phase 4</span>
      </footer>
    </div>

    <div id="gate" class="gate">
      <div class="gate__card">
        <p class="gate__eyebrow">A spatial companion study</p>
        <h1>COMPLICE</h1>
        <p class="gate__lede">
          A friend who lives in the room. She is an AI, and she says so.
        </p>
        <button id="enter" type="button">Enter the room</button>
        <p class="gate__note">Works on desktop and in a headset browser.</p>
      </div>
    </div>

    <div id="xr-slot" aria-label="Headset controls"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
